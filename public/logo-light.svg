<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="roseLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb3c6"/>
      <stop offset="50%" stop-color="#f7c4dd"/>
      <stop offset="100%" stop-color="#ffe0ec"/>
    </linearGradient>
  </defs>

  <!-- Abstract rose / sensual swirl -->
  <path d="M120 40
           C160 40 190 70 190 110
           C190 150 160 180 120 180
           C80 180 50 150 50 110
           C50 70 80 40 120 40Z"
        fill="url(#roseLight)" />

  <!-- Inner swirl -->
  <path d="M120 70
           C145 70 165 90 165 115
           C165 140 145 160 120 160
           C95 160 75 140 75 115
           C75 90 95 70 120 70Z"
        fill="rgba(255,143,184,0.35)" />

  <!-- Brand name -->
  <text x="120" y="215" font-size="32" text-anchor="middle"
        fill="#d6336c" font-family="sans-serif">
    سکسکالا
  </text>
</svg>
